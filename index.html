<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Justice Logger - Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-orange: #f97316;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            border-top: 6px solid var(--accent-orange);
            height: fit-content;
        }

        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin: 0 0 20px 0;
            color: var(--accent-orange);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .preview-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #monitorView {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .placeholder-text {
            color: #475569;
            font-size: 0.85rem;
            text-align: center;
            line-height: 1.6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Recording Pulse Indicator */
        .rec-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        .pulse {
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        .input-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border 0.2s;
        }

        input:focus { outline: none; border-color: var(--accent-orange); }
        input:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .btn-start { background: var(--accent-green); color: #0f172a; }
        .btn-start:hover { background: #16a34a; transform: translateY(-1px); }

        .btn-stop { background: var(--accent-red); color: white; display: none; }
        .btn-stop:hover { background: #dc2626; transform: translateY(-1px); }

        .status-panel {
            background: var(--bg-color);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .status-row:last-child { margin-bottom: 0; }
        .stat-val { font-family: monospace; font-weight: bold; }

        #recordingEngine { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mr. Justice Logger</h1>
        
        <div class="preview-container">
            <div id="recIndicator" class="rec-indicator">
                <div class="pulse"></div> REC
            </div>
            <div id="placeholder" class="placeholder-text">LENS DISCONNECTED<br>Await Audit Activation</div>
            <img id="monitorView" alt="Live Camera Preview">
        </div>

        <div class="input-group">
            <label for="xiaoIp">XIAO ESP32S3 IP ADDRESS</label>
            <input type="text" id="xiaoIp" placeholder="e.g., 192.168.1.50" value="192.168.">
        </div>

        <button id="startBtn" class="btn btn-start">Start Session Audit</button>
        <button id="stopBtn" class="btn btn-stop">Stop & Download Log</button>

        <div class="status-panel">
            <div class="status-row">
                <span>System Pipeline:</span>
                <span id="sysStatus" class="stat-val" style="color: var(--text-dim);">IDLE</span>
            </div>
            <div class="status-row">
                <span>Logged Duration:</span>
                <span id="timerVal" class="stat-val">00:00:00</span>
            </div>
        </div>
    </div>

    <!-- Hidden processing layer -->
    <div id="recordingEngine">
        <canvas id="streamCanvas" width="640" height="480"></canvas>
    </div>

    <script>
        /**
         * JusticeLogger Logic
         */
        const state = {
            isRecording: false,
            timerInterval: null,
            animationFrameId: null,
            totalSeconds: 0,
            mediaRecorder: null,
            chunks: []
        };

        const elements = {
            ipInput: document.getElementById('xiaoIp'),
            startBtn: document.getElementById('startBtn'),
            stopBtn: document.getElementById('stopBtn'),
            sysStatus: document.getElementById('sysStatus'),
            timerVal: document.getElementById('timerVal'),
            placeholder: document.getElementById('placeholder'),
            monitorView: document.getElementById('monitorView'),
            recIndicator: document.getElementById('recIndicator'),
            canvas: document.getElementById('streamCanvas')
        };

        const ctx = elements.canvas.getContext('2d', { alpha: false });
        elements.monitorView.crossOrigin = "anonymous";

        // Format time helper
        const formatTime = (s) => {
            const hrs = Math.floor(s / 3600).toString().padStart(2, '0');
            const mins = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
            const secs = (s % 60).toString().padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        };

        async function startAudit() {
            let ip = elements.ipInput.value.trim();
            if (!ip || ip === "192.168.") {
                alert("Please enter a valid XIAO IP address!");
                return;
            }

            // Normalize URL
            const url = ip.startsWith('http') ? ip : `http://${ip}`;
            const finalUrl = url.endsWith('/') ? url : `${url}/`;

            updateUI('CONNECTING', '#eab308');
            elements.placeholder.innerText = "Establishing Camera Feed...";
            
            elements.monitorView.src = finalUrl;
            elements.monitorView.style.display = "block";
            elements.placeholder.style.display = "none";

            // ESP32 MJPEG streams don't always trigger onload correctly.
            // We check if the image is actually rendering.
            const checkConnection = setInterval(() => {
                if (elements.monitorView.complete && elements.monitorView.naturalWidth > 0) {
                    clearInterval(checkConnection);
                    initiateRecording();
                }
            }, 500);

            // Timeout if connection fails
            setTimeout(() => {
                if (!state.isRecording) {
                    clearInterval(checkConnection);
                    handleConnectionError();
                }
            }, 8000);
        }

        function handleConnectionError() {
            updateUI('CONNECTION TIMEOUT', 'var(--accent-red)');
            elements.placeholder.innerText = "LENS DISCONNECTED\nCheck Network Configuration";
            elements.monitorView.style.display = "none";
            elements.placeholder.style.display = "block";
            alert("Connection failed. Ensure you are on the same 2.4GHz network.");
        }

        function initiateRecording() {
            state.isRecording = true;
            updateUI('RECORDING ACTIVE', 'var(--accent-green)');
            
            elements.startBtn.style.display = "none";
            elements.stopBtn.style.display = "block";
            elements.recIndicator.style.display = "flex";
            elements.ipInput.disabled = true;

            // 1. Start the high-performance render loop
            const render = () => {
                if (!state.isRecording) return;
                ctx.drawImage(elements.monitorView, 0, 0, elements.canvas.width, elements.canvas.height);
                state.animationFrameId = requestAnimationFrame(render);
            };
            render();

            // 2. Set up MediaRecorder from Canvas stream
            const stream = elements.canvas.captureStream(20); // 20 FPS
            state.mediaRecorder = new MediaRecorder(stream, { 
                mimeType: 'video/webm;codecs=vp8',
                videoBitsPerSecond: 1000000 // 1Mbps for decent quality
            });

            state.chunks = [];
            state.mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) state.chunks.push(e.data);
            };

            state.mediaRecorder.onstop = saveVideo;
            state.mediaRecorder.start();

            // 3. Timer
            state.totalSeconds = 0;
            state.timerInterval = setInterval(() => {
                state.totalSeconds++;
                elements.timerVal.innerText = formatTime(state.totalSeconds);
            }, 1000);
        }

        function saveVideo() {
            const blob = new Blob(state.chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            
            a.href = url;
            a.download = `Justice_Audit_${stamp}.webm`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function stopAudit() {
            state.isRecording = false;
            
            // Cleanup
            clearInterval(state.timerInterval);
            cancelAnimationFrame(state.animationFrameId);
            
            if (state.mediaRecorder && state.mediaRecorder.state !== "inactive") {
                state.mediaRecorder.stop();
            }

            elements.monitorView.src = "";
            elements.monitorView.style.display = "none";
            elements.placeholder.style.display = "block";
            elements.placeholder.innerText = "LENS DISCONNECTED\nAwait Audit Activation";
            elements.recIndicator.style.display = "none";
            
            updateUI('IDLE', 'var(--text-dim)');
            elements.startBtn.style.display = "block";
            elements.stopBtn.style.display = "none";
            elements.ipInput.disabled = false;
        }

        function updateUI(text, color) {
            elements.sysStatus.innerText = text;
            elements.sysStatus.style.color = color;
        }

        elements.startBtn.addEventListener('click', startAudit);
        elements.stopBtn.addEventListener('click', stopAudit);
    </script>
</body>
</html>
