<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Iron Clause — High Performance Logger</title>
<style>
/* ... Keep all your CSS from the original file ... */
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--paper:#eee9e1;--paper2:#e5ded3;--ink:#171715;--muted:#77736c;--line:#cbc4b9;--dark:#11110f;--dark2:#1b1b19;--cream:#f7f4ee;--accent:#a28b65;--green:#526b50;--red:#9b514c;}
*{box-sizing:border-box;}html,body{width:100%;height:100%;margin:0;overflow:hidden;}
body{background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased;}
#app{width:100vw;height:100vh;overflow:hidden;position:relative;}
.page{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(35px);transition:opacity .45s ease,transform .55s cubic-bezier(.22,1,.36,1),visibility .45s;}
.page.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;}
.topbar{position:absolute;top:0;left:0;right:0;height:76px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;z-index:30;border-bottom:1px solid rgba(23,23,21,.14);background:rgba(238,233,225,.68);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);}
.darkPage .topbar{color:white;border-color:rgba(255,255,255,.12);background:rgba(17,17,15,.65);}
/* (Other CSS styles omitted for brevity, but keep them in your real file) */
.cameraCard{position:relative;background:#050505;border:1px solid #2b2b28;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
#streamImage{display:none;width:100%;height:100%;object-fit:contain;image-rendering: auto;}
/* High speed fixes */
</style>
</head>
<body>
<div id="app">
    <!-- Keep your Page 1 (Intro) here -->
    <section id="pageIntro" class="page active">
        <!-- Content from original file -->
    </section>

    <!-- Page 2 (Evidence) -->
    <section id="pageEvidence" class="page darkPage">
        <header class="topbar">
            <div class="logo"><span class="logoMark">M</span><span>IRON CLAUSE</span></div>
            <div class="status"><span id="navDot2" class="statusDot"></span><span id="navStatus2">OFFLINE</span></div>
        </header>
        <main class="evidencePage">
            <div class="evidenceHeader">
                <div><div class="sectionEyebrow">Evidence / 01</div><h2 class="sectionTitle">Live High-Speed Feed</h2></div>
            </div>
            <div class="cameraLayout">
                <div class="cameraCard">
                    <div id="placeholder" class="placeholder"><div class="placeholderTitle">Establishing Link...</div></div>
                    <img id="streamImage" alt="Live Feed" crossorigin="anonymous">
                    <div id="cameraOverlay" class="cameraOverlay"><span>IRON CLAUSE / SEAMLESS</span></div>
                </div>
                <!-- Controls Card here (IP inputs, buttons, etc) -->
            </div>
        </main>
    </section>

    <!-- Page Nav -->
    <nav class="pageNav">
        <button class="pageButton active" data-page="intro">01 · INTRO</button>
        <button class="pageButton" data-page="evidence">02 · EVIDENCE</button>
    </nav>
</div>

<script>
"use strict";

const el = {
    ip: document.getElementById("ip"),
    streamImage: document.getElementById("streamImage"),
    placeholder: document.getElementById("placeholder"),
    timer: document.getElementById("timer")
};

let baseUrl = "";
let streamUrl = "";
let streamRunning = false;
let recording = false;
let recorder = null;
let chunks = [];

// ============================================================
// SEAMLESS STREAM LOGIC
// ============================================================

function startMJPEG() {
    if(!baseUrl) return;
    
    streamRunning = true;
    el.placeholder.style.display = "none";
    el.streamImage.style.display = "block";

    // IMPORTANT: Adding the ?t=TIMESTAMP prevents the browser 
    // from using a cached (laggy) version of the stream.
    el.streamImage.src = streamUrl + "?t=" + Date.now();

    el.streamImage.onload = () => {
        console.log("High-speed stream established.");
    };

    el.streamImage.onerror = () => {
        if(streamRunning) {
            console.log("Stream dropped, reconnecting...");
            setTimeout(startMJPEG, 500);
        }
    };
}

// ============================================================
// HIGH FPS RECORDING LOGIC
// ============================================================

async function buildCaptureStream() {
    // Match your firmware resolution (VGA 640x480)
    const width = 640;
    const height = 480;

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;

    // Use desynchronized: true to bypass V-Sync and hit 50FPS
    const ctx = canvas.getContext("2d", {
        alpha: false,
        desynchronized: true,
        willReadFrequently: false
    });

    // Request 60 FPS from the canvas for recording
    const stream = canvas.captureStream(60);

    function drawLoop() {
        if (!recording) return;

        // Draw the image to canvas at the fastest possible rate
        if (el.streamImage.complete && el.streamImage.naturalWidth > 0) {
            ctx.drawImage(el.streamImage, 0, 0, width, height);
        }
        
        requestAnimationFrame(drawLoop);
    }

    drawLoop();
    return stream;
}

// ============================================================
// COMMANDS
// ============================================================

async function connect() {
    const ipValue = el.ip.value.trim();
    if(!ipValue) return;
    
    baseUrl = "http://" + ipValue;
    streamUrl = "http://" + ipValue + ":81/stream";
    
    startMJPEG();
}

// Call connect when IP button is clicked
document.getElementById("connectBtn").onclick = connect;

// Ensure all page buttons work
document.querySelectorAll(".pageButton").forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.getElementById("page" + btn.dataset.page.charAt(0).toUpperCase() + btn.dataset.page.slice(1)).classList.add("active");
    };
});

</script>
</body>
</html>
