<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Iron Clause — Digital Evidence Logger</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

:root{
  --paper:#eee9e1; --paper2:#e5ded3; --ink:#171715; --muted:#77736c; --line:#cbc4b9;
  --dark:#11110f; --dark2:#1b1b19; --cream:#f7f4ee; --accent:#a28b65; --green:#526b50; --red:#9b514c;
}

*{ box-sizing:border-box; }
html, body{ width:100%; height:100%; margin:0; overflow:hidden; }
body{ background:var(--paper); color:var(--ink); font-family:"DM Sans",sans-serif; -webkit-font-smoothing:antialiased; }
button, input{ font:inherit; }
button{ cursor:pointer; }
button:disabled{ cursor:not-allowed; }

#app{ width:100vw; height:100vh; overflow:hidden; position:relative; }

/* NAVIGATION LOGIC */
.page{
  position:absolute; inset:0; width:100%; height:100%; overflow:hidden;
  opacity:0; visibility:hidden; pointer-events:none; transform:translateX(35px);
  transition: opacity .45s ease, transform .55s cubic-bezier(.22,1,.36,1), visibility .45s;
}
.page.active{ opacity:1; visibility:visible; pointer-events:auto; transform:none; }

/* TOP BAR */
.topbar{
  position:absolute; top:0; left:0; right:0; height:76px; padding:0 5vw;
  display:flex; align-items:center; justify-content:space-between; z-index:30;
  border-bottom:1px solid rgba(23,23,21,.14); background:rgba(238,233,225,.68);
  backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
}
.darkPage .topbar{ color:white; border-color:rgba(255,255,255,.12); background:rgba(17,17,15,.65); }
.logo{ display:flex; align-items:center; gap:11px; font-weight:700; letter-spacing:.08em; font-size:12px; }
.logoMark{ width:34px; height:34px; border:1px solid currentColor; border-radius:50%; display:grid; place-items:center; font-family:"Playfair Display",serif; font-size:15px; }
.status{ display:flex; align-items:center; gap:8px; font-family:"DM Mono",monospace; font-size:9px; letter-spacing:.1em; }
.statusDot{ width:7px; height:7px; border-radius:50%; background:#777; }
.statusDot.online{ background:var(--green); box-shadow:0 0 0 4px rgba(82,107,80,.12); }
.statusDot.recording{ background:var(--red); box-shadow:0 0 0 4px rgba(155,81,76,.15); }

/* INTRO PAGE */
#pageIntro{ background: radial-gradient(circle at 70% 42%, rgba(162,139,101,.13), transparent 32%), var(--paper); }
.introContent{ width:100%; height:100%; padding:100px 7vw 100px; display:grid; grid-template-columns: minmax(0,1fr) minmax(320px,.85fr); align-items:center; gap:4vw; }
.introTitle{ margin:35px 0 25px; font-family:"Playfair Display",serif; font-weight:500; font-size: clamp(65px,9vw,145px); line-height:.8; letter-spacing:-.065em; }
.italic{ font-style:italic; margin-left:8vw; display:block; }
.introDescription{ max-width:480px; font-size:14px; line-height:1.8; color:#666159; }

/* EVIDENCE PAGE */
#pageEvidence{ background:var(--dark); color:var(--cream); }
.evidencePage{ width:100%; height:100%; padding: 100px 5vw 90px; display:flex; flex-direction:column; }
.cameraLayout{ flex:1; min-height:0; display:grid; grid-template-columns: minmax(0,2.15fr) minmax(290px,.85fr); gap:18px; }
.cameraCard{ position:relative; min-height:0; background:#050505; border:1px solid #2b2b28; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
#streamImage{ display:none; width:100%; height:100%; object-fit:contain; }

/* CONTROL CARD */
.controlCard{ background:var(--cream); color:var(--ink); border-radius:8px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; }
.ipGroup{ margin:25px 0; }
.ipRow{ display:flex; border-bottom:1px solid #bbb4aa; }
.ipRow input{ width:100%; border:0; outline:0; background:transparent; padding:8px 0; font-family:"DM Mono",monospace; font-size:12px; }
.connectButton{ width:42px; height:38px; border:0; background:var(--ink); color:white; }
.controlButtons{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
.controlButtons button{ border:1px solid #c3bcb1; background:transparent; padding:11px 8px; font-size:8px; text-transform:uppercase; transition:.2s; }
.controlButtons button.primary{ background:var(--ink); color:white; }

/* NAV BAR */
.pageNav{ position:absolute; left:50%; bottom:22px; transform:translateX(-50%); z-index:100; display:flex; gap:8px; padding:7px; border:1px solid rgba(255,255,255,.25); border-radius:20px; background: linear-gradient(135deg, rgba(255,255,255,.25), rgba(255,255,255,.07)); backdrop-filter:blur(24px); }
.pageButton{ min-width:110px; padding:11px 18px; border:1px solid rgba(255,255,255,.18); border-radius:14px; background: rgba(255,255,255,0.1); color:inherit; font-family:"DM Mono",monospace; font-size:8px; text-transform:uppercase; }
.pageButton.active{ background: rgba(255,255,255,0.4); box-shadow: 0 5px 18px rgba(0,0,0,0.12); }
</style>
</head>
<body>

<div id="app">

  <!-- PAGE 1: INTRO -->
  <section id="pageIntro" class="page active">
    <header class="topbar">
      <div class="logo"><span class="logoMark">M</span><span>IRON CLAUSE</span></div>
      <div class="status"><span id="navDot" class="statusDot"></span><span id="navStatus">OFFLINE</span></div>
    </header>
    <main class="introContent">
      <div class="introCopy">
        <h1 class="introTitle"><span>MR.</span><span class="italic">JUSTICE</span></h1>
        <div class="introDescription">Compact digital evidence platform. Built for <strong>XIAO ESP32-S3 Sense</strong>. Seamless High-FPS monitoring.</div>
      </div>
    </main>
  </section>

  <!-- PAGE 2: EVIDENCE -->
  <section id="pageEvidence" class="page darkPage">
    <header class="topbar">
      <div class="logo"><span class="logoMark">M</span><span>IRON CLAUSE</span></div>
      <div class="status"><span id="navDot2" class="statusDot"></span><span id="navStatus2">OFFLINE</span></div>
    </header>
    <main class="evidencePage">
      <div class="cameraLayout">
        <div class="cameraCard">
          <div id="placeholder" style="color:#777">Awaiting connection...</div>
          <img id="streamImage" alt="Live Feed" crossorigin="anonymous">
        </div>
        <div class="controlCard">
          <div class="ipGroup">
            <label style="font-size:9px; opacity:0.6; display:block; margin-bottom:5px;">XIAO ADDRESS</label>
            <div class="ipRow">
              <input id="ip" placeholder="192.168.1.XX">
              <button id="connectBtn" class="connectButton">→</button>
            </div>
          </div>
          <div class="controlButtons">
            <button id="startBtn" class="primary">Begin Recording</button>
            <button id="stopBtn" style="color:red">End Session</button>
          </div>
          <div id="message" style="font-size:10px; margin-top:10px; opacity:0.7;">System Ready.</div>
        </div>
      </div>
    </main>
  </section>

  <!-- LIQUID GLASS NAV -->
  <nav class="pageNav">
    <button class="pageButton active" data-page="intro">01 · INTRO</button>
    <button class="pageButton" data-page="evidence">02 · EVIDENCE</button>
  </nav>

</div>

<script>
"use strict";

const pages = {
  intro: document.getElementById("pageIntro"),
  evidence: document.getElementById("pageEvidence")
};

const pageButtons = document.querySelectorAll(".pageButton");

function showPage(name) {
  Object.entries(pages).forEach(([key, page]) => {
    page.classList.toggle("active", key === name);
  });
  pageButtons.forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === name);
  });
}

pageButtons.forEach(btn => {
  btn.addEventListener("click", () => showPage(btn.dataset.page));
});

/* STREAM LOGIC */
const el = {
  ip: document.getElementById("ip"),
  connect: document.getElementById("connectBtn"),
  streamImage: document.getElementById("streamImage"),
  placeholder: document.getElementById("placeholder"),
  navDot: document.getElementById("navDot"),
  navDot2: document.getElementById("navDot2"),
  statusText: document.getElementById("navStatus"),
  statusText2: document.getElementById("navStatus2")
};

let streamUrl = "";

el.connect.onclick = () => {
  const ip = el.ip.value.trim();
  if(!ip) return;

  streamUrl = `http://${ip}:81/stream`;
  
  el.placeholder.style.display = "none";
  el.streamImage.style.display = "block";
  el.streamImage.src = streamUrl + "?t=" + Date.now();

  // Update Dots
  [el.navDot, el.navDot2].forEach(dot => dot.className = "statusDot online");
  el.statusText.innerText = el.statusText2.innerText = "ONLINE";
};

el.streamImage.onerror = () => {
  console.log("Stream error, retrying...");
  setTimeout(() => {
    el.streamImage.src = streamUrl + "?t=" + Date.now();
  }, 1000);
};

</script>
</body>
</html>
