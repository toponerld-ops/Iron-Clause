<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Justice Logger - Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-orange: #f97316;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-top: 5px solid var(--accent-orange);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-top: 0;
            color: var(--accent-orange);
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-orange);
        }

        .preview-box {
            width: 100%;
            height: 280px;
            background: #0f172a;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none; 
        }

        .placeholder-text {
            color: #475569;
            font-size: 0.9rem;
            text-align: center;
            position: absolute;
            line-height: 1.4;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 12px;
        }

        .btn-start {
            background: var(--accent-green);
            color: #0f172a;
        }

        .btn-start:hover { background: #16a34a; }

        .btn-stop {
            background: #ef4444;
            color: white;
            display: none;
        }

        .btn-stop:hover { background: #dc2626; }

        .status-panel {
            background: #0f172a;
            border-radius: 6px;
            padding: 16px;
            margin-top: 20px;
            border: 1px solid #334155;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .status-row:last-child { margin-bottom: 0; }
        .stat-val { font-weight: bold; }

        #recordingEngine { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>MR. JUSTICE LOGGER</h1>
        
        <div class="preview-box">
            <div id="placeholder" class="placeholder-text">LENS DISCONNECTED<br>Await Audit Activation</div>
            <img id="monitorView" alt="Live Camera Preview">
        </div>

        <div class="input-group">
            <label for="xiaoIp">XIAO ESP32S3 IP ADDRESS</label>
            <input type="text" id="xiaoIp" placeholder="e.g., 192.168.1.50" value="192.168.">
        </div>

        <button id="startBtn" class="btn btn-start">START SESSION AUDIT</button>
        <button id="stopBtn" class="btn btn-stop">STOP & DOWNLOAD LOG</button>

        <div class="status-panel">
            <div class="status-row">
                <span>System Pipeline:</span>
                <span id="sysStatus" class="stat-val" style="color: #64748b;">IDLE</span>
            </div>
            <div class="status-row">
                <span>Logged Duration:</span>
                <span id="timerVal" class="stat-val">00:00:00</span>
            </div>
        </div>
    </div>

    <div id="recordingEngine">
        <canvas id="streamCanvas" width="320" height="240"></canvas>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let timerInterval;
        let totalSeconds = 0;
        let recordingLoopId;

        const xiaoIpInput = document.getElementById('xiaoIp');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const sysStatus = document.getElementById('sysStatus');
        const timerVal = document.getElementById('timerVal');
        const placeholder = document.getElementById('placeholder');
        const monitorView = document.getElementById('monitorView');
        const canvas = document.getElementById('streamCanvas');
        const ctx = canvas.getContext('2d');

        monitorView.crossOrigin = "anonymous";

        startBtn.addEventListener('click', () => {
            let ip = xiaoIpInput.value.trim();
            if (!ip || ip === "192.168.") {
                alert("Please enter your absolute XIAO IP address first!");
                return;
            }

            if (!ip.startsWith('http://') && !ip.startsWith('https://')) {
                ip = 'http://' + ip;
            }
            if (!ip.endsWith('/')) {
                ip = ip + '/';
            }

            sysStatus.innerText = "CONNECTING...";
            sysStatus.style.color = "#eab308";
            placeholder.innerText = "ESTABLISHING CAMERA FEED PIPELINES...";

            monitorView.src = ip;
            monitorView.style.display = "block";
            placeholder.style.display = "none";

            monitorView.onload = function() {
                if (mediaRecorder && mediaRecorder.state === "recording") return;
                startRecordingSession();
            };

            monitorView.onerror = function() {
                sysStatus.innerText = "CONNECTION TIMEOUT";
                sysStatus.style.color = "#ef4444";
                placeholder.innerText = "LENS DISCONNECTED\nCheck Network Routing Configuration";
                monitorView.style.display = "none";
                placeholder.style.display = "block";
                alert("Cannot connect to XIAO board! Ensure your laptop is linked to the same 2.4 GHz network pool.");
            };
        });

        function startRecordingSession() {
            sysStatus.innerText = "RECORDING ACTIVE";
            sysStatus.style.color = "var(--accent-green)";
            
            startBtn.style.display = "none";
            stopBtn.style.display = "block";
            xiaoIpInput.disabled = true;

            function processVideoFrames() {
                if (monitorView.complete && monitorView.naturalWidth > 0) {
                    ctx.drawImage(monitorView, 0, 0, canvas.width, canvas.height);
                }
                recordingLoopId = setTimeout(processVideoFrames, 100); 
            }
            processVideoFrames();

            const videoStream = canvas.captureStream(10); 
            const options = { mimeType: 'video/webm;codecs=vp8' };
            recordedChunks = [];
            
            mediaRecorder = new MediaRecorder(videoStream, options);
            
            mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                
                const downloadLink = document.createElement('a');
                downloadLink.style.display = 'none';
                downloadLink.href = url;
                
                const now = new Date();
                const fileStamp = now.toISOString().replace(/T/, '_').replace(/\..+/, '').replace(/:/g, '-');
                downloadLink.download = `Justice_Audit_Log_${fileStamp}.webm`;
                
                document.body.appendChild(downloadLink);
                downloadLink.click();
                
                setTimeout(() => {
                    document.body.removeChild(downloadLink);
                    window.URL.revokeObjectURL(url);
                }, 100);
            };

            mediaRecorder.start(1000); 

            totalSeconds = 0;
            timerVal.innerText = "00:00:00";
            timerInterval = setInterval(() => {
                totalSeconds++;
                let hr = Math.floor(totalSeconds / 3600);
                let min = Math.floor((totalSeconds % 3600) / 60);
                let sec = totalSeconds % 60;
                timerVal.innerText = `${String(hr).padStart(2, '0')}:${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
            }, 1000);
        }

        stopBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            clearTimeout(recordingLoopId); 
            
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }

            monitorView.src = "";
        monitorView.style.display = "none";
            placeholder.style.display = "block";
            placeholder.innerText = "LENS DISCONNECTED\nAwait Audit Activation";
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            sysStatus.innerText = "IDLE";
            sysStatus.style.color = "#64748b";
            startBtn.style.display = "block";
            stopBtn.style.display = "none";
            xiaoIpInput.disabled = false;
        });
