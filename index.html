<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRON CLAUSE — MIC DIAGNOSTIC</title>
<style>
body{margin:0;background:#080909;color:#eee9dc;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:30px}
h1{letter-spacing:3px;margin:6px 0;color:#e0bf69}
.k{color:#c9a24a;letter-spacing:4px;font-size:12px}
.card{background:#111414;border:1px solid #383b38;border-radius:10px;padding:20px;margin-top:18px}
input{background:#080909;color:white;border:1px solid #444;padding:12px;width:70%;font-size:16px}
button{background:#17150e;color:#e0bf69;border:1px solid #c9a24a;padding:12px 18px;margin-left:8px;cursor:pointer}
.status{margin-top:15px;color:#858982}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}
.m{background:#090b0b;border:1px solid #333;padding:14px}
.m small{display:block;color:#858982}
.m b{font-size:25px;color:#e0bf69}
.meter{height:24px;background:#070808;border:1px solid #333;margin-top:18px}
.fill{height:100%;width:0;background:#c9a24a}
canvas{width:100%;height:250px;background:#070808;border:1px solid #333;margin-top:18px}
#result{font-size:22px;color:#e0bf69;margin-top:12px}
@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}input{width:55%}}
</style>
</head>
<body>
<div class="wrap">
<div class="k">IRON CLAUSE</div>
<h1>MICROPHONE DIAGNOSTIC</h1>
<div class="card">
  <input id="ip" placeholder="192.168.1.8">
  <button onclick="connect()">CONNECT</button>
  <div id="status" class="status">DISCONNECTED</div>
</div>

<div class="card">
  <div class="grid">
    <div class="m"><small>ADC</small><b id="adc">—</b></div>
    <div class="m"><small>MIN</small><b id="min">—</b></div>
    <div class="m"><small>MAX</small><b id="max">—</b></div>
    <div class="m"><small>P-P</small><b id="p2p">—</b></div>
  </div>
  <div class="meter"><div id="fill" class="fill"></div></div>
  <div id="result">WAITING</div>
</div>

<div class="card">
  <canvas id="graph" width="900" height="250"></canvas>
  <div class="status">This graph uses the XIAO's actual D3 ADC measurements. It does not use the computer microphone.</div>
</div>
</div>

<script>
let ip="",timer=null,history=[];
const c=document.getElementById("graph"),x=c.getContext("2d");

function draw(){
  x.clearRect(0,0,c.width,c.height);
  x.strokeStyle="#292c2a";
  for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,i*c.height/5);x.lineTo(c.width,i*c.height/5);x.stroke();}
  if(history.length<2)return;
  x.strokeStyle="#c9a24a";x.lineWidth=2;x.beginPath();
  history.forEach((v,i)=>{
    let px=i/(history.length-1)*c.width;
    let py=c.height-v*c.height/180;
    py=Math.max(0,Math.min(c.height,py));
    i?x.lineTo(px,py):x.moveTo(px,py);
  });
  x.stroke();
}

async function poll(){
  try{
    let r=await fetch("http://"+ip+"/mic?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw Error("HTTP "+r.status);
    let d=await r.json();

    document.getElementById("adc").textContent=d.adc;
    document.getElementById("min").textContent=d.min;
    document.getElementById("max").textContent=d.max;
    document.getElementById("p2p").textContent=d.p2p;

    let level=Math.min(100,d.p2p/180*100);
    document.getElementById("fill").style.width=level+"%";

    history.push(d.p2p);
    if(history.length>100)history.shift();
    draw();

    let result=document.getElementById("result");
    if(d.p2p<15)result.textContent="VERY QUIET";
    else if(d.p2p<40)result.textContent="SIGNAL DETECTED";
    else if(d.p2p<120)result.textContent="GOOD AUDIO SIGNAL";
    else result.textContent="STRONG AUDIO SIGNAL";

    document.getElementById("status").textContent="CONNECTED · receiving D3 ADC";
  }catch(e){
    document.getElementById("status").textContent="CONNECTION ERROR: "+e.message;
  }
}

async function connect(){
  ip=document.getElementById("ip").value.trim();
  if(!ip)return;
  if(timer)clearInterval(timer);
  document.getElementById("status").textContent="CONNECTING...";
  try{
    let r=await fetch("http://"+ip+"/mic?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw Error("HTTP "+r.status);
    await r.json();
    document.getElementById("status").textContent="CONNECTED";
    poll();
    timer=setInterval(poll,100);
  }catch(e){
    document.getElementById("status").textContent="FAILED: "+e.message;
  }
}
draw();
</script>
</body>
</html>
